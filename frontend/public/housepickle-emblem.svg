<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hp-green-pillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <linearGradient id="hp-gray-pillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="hp-ball" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#BEF264" />
      <stop offset="45%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </linearGradient>

    <linearGradient id="hp-roof-trim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="hp-drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="hp-ball-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Gray Tower Pillar -->
  <rect x="25" y="32" width="13" height="42" rx="2" fill="url(#hp-gray-pillar)" />
  <rect x="25" y="32" width="13" height="3" rx="1" fill="#94A3B8" opacity="0.6" />

  <!-- Right Vibrant Green Tower Pillar -->
  <rect x="67" y="10" width="16" height="64" rx="2.5" fill="url(#hp-green-pillar)" filter="url(#hp-drop-shadow)" />
  <rect x="67" y="10" width="16" height="4" rx="1" fill="#86EFAC" opacity="0.7" />

  <!-- House Gable / Roof Structure with Outer Rafters -->
  <!-- Backing Shadow -->
  <path d="M 52 17 L 11 60 L 19 68 L 52 33 L 85 68 L 93 60 Z" fill="#092612" opacity="0.3" />

  <!-- House Triangle Interior (Dark Architectural Field) -->
  <polygon points="52,28 21,63 83,63" fill="#0F172A" />

  <!-- Outer Roof Gable Chevron (Crisp Architectural White/Silver) -->
  <path d="M 52 18 L 13 58 L 20 65 L 52 31 L 84 65 L 91 58 Z" fill="url(#hp-roof-trim)" filter="url(#hp-drop-shadow)" />

  <!-- 4-Pane Architectural Window -->
  <g transform="translate(44, 44)">
    <!-- Top-Left Pane -->
    <rect x="0" y="0" width="6.5" height="6.5" rx="0.8" fill="#FFFFFF" />
    <!-- Top-Right Pane -->
    <rect x="8.5" y="0" width="6.5" height="6.5" rx="0.8" fill="#FFFFFF" />
    <!-- Bottom-Left Pane -->
    <rect x="0" y="8.5" width="6.5" height="6.5" rx="0.8" fill="#FFFFFF" />
    <!-- Bottom-Right Pane -->
    <rect x="8.5" y="8.5" width="6.5" height="6.5" rx="0.8" fill="#FFFFFF" />
  </g>

  <!-- Lime Optic Pickleball with Perforated Holes -->
  <g filter="url(#hp-ball-shadow)">
    <!-- Ball Base -->
    <circle cx="95" cy="50" r="18" fill="url(#hp-ball)" stroke="#365314" stroke-width="0.8" />

    <!-- Ball Highlight Curved Rim -->
    <path d="M 83 40 A 15 15 0 0 1 106 37" stroke="#ECFCCB" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Authentic Pickleball Perforation Holes -->
    <circle cx="89" cy="41" r="1.8" fill="#14532D" />
    <circle cx="97" cy="38" r="2.0" fill="#14532D" />
    <circle cx="104" cy="43" r="1.8" fill="#14532D" />

    <circle cx="87" cy="49" r="2.1" fill="#14532D" />
    <circle cx="95" cy="48" r="2.2" fill="#14532D" />
    <circle cx="103" cy="52" r="1.9" fill="#14532D" />

    <circle cx="90" cy="58" r="1.8" fill="#14532D" />
    <circle cx="98" cy="59" r="2.0" fill="#14532D" />
    <circle cx="106" cy="60" r="1.5" fill="#14532D" />
  </g>
</svg>
