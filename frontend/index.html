    <!-- Service Worker: production caching only; automatically bypasses on localhost to prevent port desync -->
    <script>
      if ('serviceWorker' in navigator) {
        const isLocalhost = Boolean(
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname === '[::1]'
        );

        if (isLocalhost) {
          // Unregister any active SW and purge cache on localhost so dev ports are always aligned
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const key of keys) caches.delete(key);
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => {
                reg.onupdatefound = () => {
                  const installingWorker = reg.installing;
                  if (installingWorker) {
                    installingWorker.onstatechange = () => {
                      if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        console.log('[HousePickle] New content available; refreshing...');
                      }
                    };
                  }
                };
              })
              .catch((err) => {
                console.warn('[HousePickle] ServiceWorker registration skipped:', err);
              });
          });
        }
      }
    </script>
  </body>
