<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Metadata -->
    <title>HousePickle Club | 24/7 Premier Pickleball Court Koronadal</title>
    <meta name="description" content="Book 24/7 pickleball courts in Koronadal City. In front of Aloha Suites, Brgy. San Isidro. Smooth knee-friendly courts, bright night lights, easy GCash payment, and paddle rentals." />
    <meta name="keywords" content="HousePickle Club, HousePickle, Pickleball Koronadal, 24/7 pickleball, Koronadal City sports, Aloha Suites pickleball, Reymark Vergara" />

    <!-- Open Graph -->
    <meta property="og:title" content="HousePickle Club | 24/7 Premier Pickleball Court Koronadal" />
    <meta property="og:description" content="Direct booking, 24-hour court play, GCash payments, pro lighting & gear rentals in Koronadal City." />
    <meta property="og:image" content="/images/hero-play.webp" />
    <meta property="og:type" content="website" />

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#15803D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HousePickle Club" />

    <!-- Performance Preloads -->
    <link rel="preload" as="image" href="/images/player-cutout-1.webp" type="image/webp" />
    <link rel="preload" as="image" href="/icon.svg" type="image/svg+xml" />

    <!-- Google Fonts: Righteous (Pickleball brand), Space Grotesk, Barlow Semi Condensed & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Righteous&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans antialiased selection:bg-[#15803D] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Production Service Worker Registration for Instant Caching & PWA Support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              // Check for SW updates periodically
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[HousePickle] New content is available; refreshing...');
                    }
                  };
                }
              };
            })
            .catch((err) => {
              console.warn('[HousePickle] ServiceWorker registration skipped:', err);
            });
        });
      }
    </script>
  </body>
</html>
