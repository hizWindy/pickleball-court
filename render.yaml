services:
  - type: web
    name: housepickle-club
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && npm --prefix ../frontend ci && npm --prefix ../frontend run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    disk:
      name: housepickle-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD_HASH
        sync: false

