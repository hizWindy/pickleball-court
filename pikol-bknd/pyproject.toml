[project]
name = "pikol-bknd"
version = "0.1.0"
description = "FastAPI application powered by Kaira"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "slowapi>=0.1.9",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "bcrypt>=4.1.2,<5.0.0",

    # Auth dependencies (always included for simplicity and guard layers)
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["B008"]